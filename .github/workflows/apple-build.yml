name: Apple simulator build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and Xcode project structure
        run: python3 watch-codex-companion/Scripts/check_source.py
      - name: Run offline protocol tests
        run: node --test watch-codex-probe/probe.test.mjs

  apple-build:
    needs: offline-checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Swift core and build both simulator apps
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          bash watch-codex-companion/Scripts/verify_apple.sh 2>&1 | tee build-logs/apple-build.log
      - name: Capture unconnected setup simulator screens
        shell: bash
        run: |
          set -o pipefail
          python3 watch-codex-companion/Scripts/capture_simulators.py 2>&1 | tee build-logs/simulator-capture.log
      - name: Save simulator screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-setup-screenshots
          path: |
            watch-codex-companion/.build/screenshots/
            build-logs/simulator-capture.log
          retention-days: 7
          if-no-files-found: warn
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-log
          path: build-logs/apple-build.log
          retention-days: 7
          if-no-files-found: warn
